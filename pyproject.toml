[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xyz-agent-context"
version = "1.19.0"
description = "XYZ Agent Context Framework for multi-agent systems"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.72.0",
    "claude-agent-sdk~=0.1.43",
    "openai>=2.7.1",
    "openai-agents>=0.19.1",
    # Official OpenAI Codex SDK — drives CodexSDKv2 (the v2 agent-loop
    # driver registered under `codex_cli_v2`). Pinned to 0.1.x because
    # the package is beta — accept patch/beta bumps inside 0.1, but
    # treat 0.2 as a breaking change requiring deliberate upgrade.
    # Transitively pulls openai-codex-cli-bin (the codex binary as a
    # wheel) so users no longer need `npm install -g @openai/codex`.
    "openai-codex>=0.1.0b3,<0.2",
    "mcp[cli]>=1.20.0",
    "loguru>=0.7.3",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.2.0",
    "croniter>=6.0.0",
    # Timeout-capable regex engine for grep_memory over untrusted (LLM-supplied)
    # patterns — stdlib `re` is uninterruptible, so a ReDoS pattern would wedge
    # the shared API loop. Was already present transitively; now a direct dep
    # because retrieval.grep_filter imports it explicitly.
    "regex>=2024.0.0",
    "aiomysql>=0.3.2",
    # Floor raised from 0.20.0 on 2026-08-17: db_backend_sqlite monkeypatches
    # aiosqlite internals (the module-level `core._connection_worker_thread`
    # and `Connection._thread`), and setting an attribute that upstream has
    # renamed away SUCCEEDS SILENTLY — the hardening would degrade to a no-op
    # and the 5-minute lock class would come back green. uv.lock pins 0.22.1.
    "aiosqlite>=0.22.1",
    # A RUNTIME dep, not a test one (2026-08-17): `skill_module.py` imports yaml
    # unconditionally at module scope. Before this line it was in the graph only
    # transitively, so the day the resolver stopped routing it here the
    # SkillModule would have stopped importing — in production, with a traceback
    # pointing at pyyaml rather than at the missing declaration. Which packages
    # supply it transitively is a property of the resolution, not of our need for
    # it, so they are deliberately not named here. Same reasoning as `regex`.
    "pyyaml>=6.0",
    "google-genai>=1.0.0",
    "fastmcp>=2.14.1",
    "numpy>=1.26.0",
    # libmagic content-based MIME sniffing for uploaded/ingested bytes
    # (utils/mime_sniff.py tier 1). Without it the sniffer falls back to the
    # spoofable file extension / client Content-Type — a WAV renamed .png
    # classified as an image. This wheel is pure-Python; it needs the native
    # system libmagic1 at runtime, which must be installed in EVERY image that
    # serves uploads: docker/Dockerfile.manyfold here AND the deploy repo's
    # docker/Dockerfile.python (the dev/prod backend/mcp/workers image). Until
    # that companion deploy change ships, cloud sniffing degrades to the
    # extension (and logs a one-time warning — see mime_sniff._warn_libmagic_missing_once).
    "python-magic>=0.4.27",
    "httpx[socks]",
    "bcrypt>=5.0.0",
    # Fernet encryption for skill env_config secrets (skill marketplace).
    "cryptography>=42.0.0",
    # S3 artifact storage for the skill marketplace. boto3 is imported ONLY
    # inside _skill_marketplace_impl/artifact_store.py (swap-friendly).
    "boto3>=1.34.0",
    "pyjwt>=2.10.1",
    "lark-oapi>=1.4.0,<2.0.0",
    "slack-sdk>=3.27.0",
    "discord.py>=2.4.0",
    # matrix-nio — Matrix client library for NarraMessenger MatrixTrigger
    # (replaces polling long-poll on the message plane). Pinned to the
    # non-`[e2e]` variant on purpose: matrix.netmind.chat rooms are
    # confirmed plaintext by default (2026-07-02 probe), so we skip
    # libolm and its native-C build burden. If encryption ever gets
    # turned on server-side, switch to `matrix-nio[e2e]`.
    "matrix-nio>=0.25.0",
    "aiohttp>=3.9.0",
    "ddgs>=9.0.0",
    "websockets>=15.0.1",
    "tiktoken>=0.13.0",
    # Floor at the newest STABLE release rather than an ancient one: with
    # a low floor the resolver is free to wander onto a pre-release above
    # it, which is how 1.95.0.dev3 got locked.
    "litellm>=1.94.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xyz_agent_context", "backend"]

[tool.uv]
# Pre-release policy. ``openai-codex`` 0.1.0b3 + its transitive
# ``openai-codex-cli-bin`` 0.137.0a4 (the wheel that ships the codex
# binary) have no stable release, so SOME pre-release allowance is
# REQUIRED. It used to be a blanket "allow", which quietly dragged
# packages that DO ship stable builds onto pre-releases with them:
# ``litellm`` locked to 1.95.0.dev3 while 1.94.0 sat on PyPI, putting a
# yankable dev build on the `uv sync --frozen` path of every image
# (2026-07-29 review). This narrower mode grants pre-releases only where
# a requirement asks for one or nothing stable exists — which is exactly
# the codex case and nothing else. Drop it entirely once those packages
# reach 1.0.
prerelease = "if-necessary-or-explicit"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pyright>=1.1.390",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Start conservative — only catch clear bugs, not style
select = ["E", "F"]
# Ignore rules that conflict with existing codebase patterns
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-level import not at top (lazy imports are intentional)
    "E721",   # type comparison using == (existing patterns)
    "E741",   # ambiguous variable name
    "F401",   # unused imports (too many false positives with re-exports)
    "F811",   # redefinition of unused name
    "F841",   # local variable assigned but never used
]
# F821 (undefined name) is deliberately NOT ignored. It was, with the stated
# reason "false positives with forward refs and method scope" — but running it
# over the entire tree produced exactly four hits, all of them real string
# annotations naming a type the module never imports, and all fixed by a
# TYPE_CHECKING import. The cost of the ignore was paid on 2026-08-18: four
# methods in database.py referenced an undefined `fetch` and shipped through
# lint, CI and three review rounds; the first caller on the lazy path got a
# NameError.
#
# Enforcement follows the repo's existing lint scope — CI and `make lint` both
# run `ruff check src/ backend/` — so scripts/ and tests/ are checked only when
# someone runs ruff over the tree by hand. Widening that scope is a separate
# change: it turns up pre-existing F541/E401/E702 outside src/ and backend/.

[tool.ruff.lint.isort]
known-first-party = ["xyz_agent_context", "backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Make `uv run pytest` work without a manual PYTHONPATH or editable install:
# `src` for the xyz_agent_context package, `.` for the backend package.
pythonpath = ["src", "."]
