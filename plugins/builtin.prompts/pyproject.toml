[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narranexus-plugin-prompts"
version = "1.0.0"
description = "The default system-prompt sections (security / temporal / narrative / modules / bootstrap) and the default assembler."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
# The engine (narranexus) hosts this package; a distribution installs both.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/narranexus_plugins"]
