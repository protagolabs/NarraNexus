[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narranexus-plugin-channels-telegram"
version = "1.0.0"
description = "Builtin module TelegramModule (IM channel: trigger + module + tools)."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
# The engine (narranexus) hosts this package; a distribution installs both.
dependencies = []

[project.optional-dependencies]
full = []

[tool.hatch.build.targets.wheel]
packages = ["src/narranexus_plugins"]
