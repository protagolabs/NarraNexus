[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narranexus-plugin-frameworks-claude-code"
version = "1.0.0"
description = "Claude Agent SDK driver; SDK installed on demand on the local build."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
# The engine (narranexus) hosts this package; a distribution installs both.
dependencies = []

[project.optional-dependencies]
full = []

[tool.hatch.build.targets.wheel]
packages = ["src/narranexus_plugins"]

# The manifest ships inside the wheel: the engine reads it from the package
# (narranexus.kernel.plugins.builtins), the source checkout is the fallback.
[tool.hatch.build.targets.wheel.force-include]
"narranexus-plugin.json" = "narranexus_plugins/frameworks_claude_code/narranexus-plugin.json"
